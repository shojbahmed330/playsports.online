name: Regenerate Supabase Types

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Supabase project ref"
        required: true
        default: "vagqeperdsumxwukwbes"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Supabase CLI
        run: npm i -g supabase

      - name: Generate types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p src/integrations/supabase
          supabase gen types typescript \
            --project-id "${{ github.event.inputs.project_id }}" \
            > src/integrations/supabase/types.ts

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "No changes."
          else
            git add src/integrations/supabase/types.ts
            git commit -m "chore(supabase): regenerate types"
            git push
          fi
